name: Validar admin e worker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: railway-worker/requirements.txt
      - run: pip install -r railway-worker/requirements.txt
      - run: pip check
      - run: python -m unittest discover -s tests
        working-directory: railway-worker
